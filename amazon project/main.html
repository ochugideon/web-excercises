<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Amazon clone</title>
  <link rel="stylesheet" href="amazon-styles.css">
</head>
<body>
  
    <div class="nav-bar">
      <div class="left-part">
        <img src="images/icons/amazon-logo-dark-bg.jpg" alt="">
      </div>
      <div class="middle-part">
        <div class="search-area">
          <input class="search-field" type="text" placeholder="Search">
          <button class="search-btn">
            <img src="images/icons/search-icon.png" alt="" class="search-icon">
          </button>
        </div>
      </div>
      <div class="right-part">
        <div class="order-texts">
          <p class="top-text">Returns</p>
          <p class="bottom-text">& Orders</p>
        </div>
        <div class="cart-group">
          <img src="images/icons/amazon-cart-icon.JPG" class="cart-icon" alt="">
          <p class="cart-qty">0</p>
        </div>
        </div>
    </div>

    <div class="main-container">
      <div class="product-container">
        
      </div>
    </div>

<script src="functionality.js"></script>
</body>
</html>
